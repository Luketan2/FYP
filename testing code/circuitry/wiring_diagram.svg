<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Consolas,monospace" font-size="12">
  <rect width="1100" height="800" fill="#f8f9fa"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Direct Shear Device — Wiring Diagram</text>
  <text x="550" y="50" text-anchor="middle" font-size="11" fill="#666">ESP32 DOIT DevKit V1  ·  Mellow Fly TMC5160 Pro V1.5  ·  HX711  ·  Digital Caliper</text>

  <!-- ═══════════════════ ESP32 ═══════════════════ -->
  <rect x="20" y="70" width="190" height="560" rx="8" fill="#dbeafe" stroke="#1a56db" stroke-width="2"/>
  <text x="115" y="90" text-anchor="middle" font-weight="bold" fill="#1a56db" font-size="13">ESP32 DevKit V1</text>

  <text x="110" y="120" text-anchor="middle" fill="#1e3a5f" font-size="11">─── SPI / STEP-DIR ───</text>
  <text x="30"  y="142" fill="#333">GPIO16</text><text x="95"  y="142" fill="#666" font-size="10">(STEP)</text>
  <text x="30"  y="165" fill="#333">GPIO17</text><text x="95"  y="165" fill="#666" font-size="10">(DIR)</text>
  <text x="30"  y="188" fill="#333">GPIO4 </text><text x="95"  y="188" fill="#666" font-size="10">(EN)</text>
  <text x="30"  y="211" fill="#333">GPIO22</text><text x="95"  y="211" fill="#666" font-size="10">(CS)</text>
  <text x="30"  y="234" fill="#333">GPIO18</text><text x="95"  y="234" fill="#666" font-size="10">(SCK)</text>
  <text x="30"  y="257" fill="#333">GPIO19</text><text x="95"  y="257" fill="#666" font-size="10">(MISO)</text>
  <text x="30"  y="280" fill="#333">GPIO23</text><text x="95"  y="280" fill="#666" font-size="10">(MOSI)</text>

  <text x="110" y="312" text-anchor="middle" fill="#1e3a5f" font-size="11">─── HX711 ───</text>
  <text x="30"  y="334" fill="#333">GPIO32</text><text x="95"  y="334" fill="#666" font-size="10">(DOUT)</text>
  <text x="30"  y="357" fill="#333">GPIO33</text><text x="95"  y="357" fill="#666" font-size="10">(SCK)</text>

  <text x="110" y="389" text-anchor="middle" fill="#1e3a5f" font-size="11">─── Caliper ───</text>
  <text x="30"  y="411" fill="#333">GPIO27</text><text x="95"  y="411" fill="#666" font-size="10">(CLK)</text>
  <text x="30"  y="434" fill="#333">GPIO26</text><text x="95"  y="434" fill="#666" font-size="10">(DATA)</text>

  <text x="110" y="466" text-anchor="middle" fill="#1e3a5f" font-size="11">─── Power ───</text>
  <text x="30"  y="488" fill="#c81e1e" font-weight="bold">3.3V</text><text x="65" y="488" fill="#888" font-size="10"> → VIO</text>
  <text x="30"  y="511" fill="#c81e1e" font-weight="bold">3.3V</text><text x="65" y="511" fill="#888" font-size="10"> → HX711</text>
  <text x="30"  y="534" fill="#333">5V</text>
  <text x="30"  y="557" fill="#333">GND</text>
  <text x="30"  y="580" fill="#333">GND</text>
  <text x="30"  y="603" fill="#333">GND</text>

  <!-- Connector dots on right edge of ESP32 -->
  <circle cx="210" cy="141" r="4" fill="#1a56db"/>
  <circle cx="210" cy="164" r="4" fill="#1a56db"/>
  <circle cx="210" cy="187" r="4" fill="#1a56db"/>
  <circle cx="210" cy="210" r="4" fill="#1a56db"/>
  <circle cx="210" cy="233" r="4" fill="#1a56db"/>
  <circle cx="210" cy="256" r="4" fill="#1a56db"/>
  <circle cx="210" cy="279" r="4" fill="#1a56db"/>
  <circle cx="210" cy="333" r="4" fill="#057a55"/>
  <circle cx="210" cy="356" r="4" fill="#057a55"/>
  <circle cx="210" cy="410" r="4" fill="#9d174d"/>
  <circle cx="210" cy="433" r="4" fill="#9d174d"/>
  <circle cx="210" cy="487" r="4" fill="#c81e1e"/>
  <circle cx="210" cy="510" r="4" fill="#c81e1e"/>
  <circle cx="210" cy="533" r="4" fill="#f59e0b"/>
  <circle cx="210" cy="556" r="4" fill="#000"/>
  <circle cx="210" cy="579" r="4" fill="#000"/>
  <circle cx="210" cy="602" r="4" fill="#000"/>

  <!-- ═══════════════════ TMC5160 ═══════════════════ -->
  <rect x="430" y="70" width="190" height="450" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="525" y="90" text-anchor="middle" font-weight="bold" fill="#92400e" font-size="13">TMC5160 Pro V1.5</text>
  <text x="525" y="108" text-anchor="middle" fill="#92400e" font-size="10">Mellow Fly  |  R_SENSE = 0.075Ω</text>

  <!-- SPI / STEP-DIR pins (left edge, connect to ESP32) -->
  <text x="440" y="140" fill="#333">STEP</text>
  <text x="440" y="163" fill="#333">DIR</text>
  <text x="440" y="186" fill="#333">EN</text><text x="470" y="186" fill="#888" font-size="10"> (active LOW)</text>
  <text x="440" y="209" fill="#333">CS</text>
  <text x="440" y="232" fill="#333">SCK</text>
  <text x="440" y="255" fill="#333">SDO</text><text x="470" y="255" fill="#666" font-size="10"> (MISO)</text>
  <text x="440" y="278" fill="#333">SDI</text><text x="468" y="278" fill="#666" font-size="10"> (MOSI)</text>

  <!-- Power section (right edge, connect to PSU) -->
  <text x="440" y="320" fill="#92400e" font-size="11">─── Power ───</text>
  <text x="440" y="342" fill="#c81e1e" font-weight="bold">VIO</text>
  <text x="465" y="342" fill="#c81e1e" font-size="10" font-weight="bold"> ← MUST be 3.3V!</text>
  <text x="440" y="365" fill="#b45309" font-weight="bold">VM</text>
  <text x="462" y="365" fill="#b45309" font-size="10"> 12–48V motor PSU</text>
  <text x="440" y="388" fill="#333">GND</text><text x="470" y="388" fill="#666" font-size="10"> (shared)</text>

  <!-- Operating mode annotation -->
  <text x="440" y="418" fill="#92400e" font-size="11">─── Settings ───</text>
  <text x="440" y="435" fill="#555" font-size="10">StealthChop2 mode</text>
  <text x="440" y="450" fill="#555" font-size="10">1000 mA RMS, 16× microsteps</text>
  <text x="440" y="465" fill="#555" font-size="10">INTPOL=true  →  3200 SPR</text>

  <!-- Motor section (right edge) -->
  <text x="440" y="490" fill="#92400e" font-size="11">─── Motor ───</text>
  <text x="440" y="507" fill="#333">A1 / A2</text><text x="488" y="507" fill="#666" font-size="10"> Coil A</text>
  <text x="440" y="524" fill="#333">B1 / B2</text><text x="488" y="524" fill="#666" font-size="10"> Coil B</text>

  <!-- LEFT-edge connector dots (SPI/STEP-DIR + VIO) -->
  <circle cx="430" cy="139" r="4" fill="#1a56db"/>
  <circle cx="430" cy="162" r="4" fill="#1a56db"/>
  <circle cx="430" cy="185" r="4" fill="#1a56db"/>
  <circle cx="430" cy="208" r="4" fill="#1a56db"/>
  <circle cx="430" cy="231" r="4" fill="#1a56db"/>
  <circle cx="430" cy="254" r="4" fill="#1a56db"/>
  <circle cx="430" cy="277" r="4" fill="#1a56db"/>
  <circle cx="430" cy="341" r="4" fill="#c81e1e"/>
  <!-- GND left-edge (from ESP32 GND) -->
  <circle cx="430" cy="387" r="4" fill="#000"/>

  <!-- RIGHT-edge connector dots (VM and GND to PSU, motor coils) -->
  <circle cx="620" cy="364" r="4" fill="#b45309"/>
  <circle cx="620" cy="387" r="4" fill="#000"/>
  <circle cx="620" cy="506" r="4" fill="#7e3af2"/>
  <circle cx="620" cy="523" r="4" fill="#7e3af2"/>

  <!-- ═══════════════════ Wires: ESP32 → TMC5160 ═══════════════════ -->
  <!-- STEP -->
  <line x1="210" y1="141" x2="430" y2="139" stroke="#1a56db" stroke-width="1.5"/>
  <text x="320" y="133" text-anchor="middle" fill="#1a56db" font-size="10">STEP</text>
  <!-- DIR -->
  <line x1="210" y1="164" x2="430" y2="162" stroke="#1a56db" stroke-width="1.5"/>
  <text x="320" y="156" text-anchor="middle" fill="#1a56db" font-size="10">DIR</text>
  <!-- EN -->
  <line x1="210" y1="187" x2="430" y2="185" stroke="#1a56db" stroke-width="1.5"/>
  <text x="320" y="179" text-anchor="middle" fill="#1a56db" font-size="10">EN</text>
  <!-- CS -->
  <line x1="210" y1="210" x2="430" y2="208" stroke="#1a56db" stroke-width="1.5"/>
  <text x="320" y="202" text-anchor="middle" fill="#1a56db" font-size="10">CS</text>
  <!-- SCK -->
  <line x1="210" y1="233" x2="430" y2="231" stroke="#1a56db" stroke-width="1.5"/>
  <text x="320" y="225" text-anchor="middle" fill="#1a56db" font-size="10">SCK</text>
  <!-- MISO (dashed = bidirectional) -->
  <line x1="210" y1="256" x2="430" y2="254" stroke="#1a56db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="320" y="248" text-anchor="middle" fill="#1a56db" font-size="10">MISO</text>
  <!-- MOSI -->
  <line x1="210" y1="279" x2="430" y2="277" stroke="#1a56db" stroke-width="1.5"/>
  <text x="320" y="271" text-anchor="middle" fill="#1a56db" font-size="10">MOSI</text>

  <!-- 3.3V → VIO (left edge of TMC) -->
  <line x1="210" y1="487" x2="350" y2="487" stroke="#c81e1e" stroke-width="2"/>
  <line x1="350" y1="487" x2="350" y2="341" stroke="#c81e1e" stroke-width="2"/>
  <line x1="350" y1="341" x2="430" y2="341" stroke="#c81e1e" stroke-width="2"/>

  <!-- ESP32 GND → TMC GND (left edge) -->
  <line x1="210" y1="556" x2="360" y2="556" stroke="#333" stroke-width="1.5"/>
  <line x1="360" y1="556" x2="360" y2="387" stroke="#333" stroke-width="1.5"/>
  <line x1="360" y1="387" x2="430" y2="387" stroke="#333" stroke-width="1.5"/>

  <!-- ═══════════════════ Stepper Motor ═══════════════════ -->
  <rect x="760" y="430" width="160" height="110" rx="8" fill="#ede9fe" stroke="#7e3af2" stroke-width="2"/>
  <text x="840" y="452" text-anchor="middle" font-weight="bold" fill="#5b21b6" font-size="13">Stepper Motor</text>
  <text x="840" y="474" text-anchor="middle" fill="#5b21b6" font-size="11">Coil A  ←  A1 / A2</text>
  <text x="840" y="494" text-anchor="middle" fill="#5b21b6" font-size="11">Coil B  ←  B1 / B2</text>
  <text x="840" y="518" text-anchor="middle" fill="#888" font-size="10">4-wire bipolar</text>
  <circle cx="760" cy="473" r="4" fill="#7e3af2"/>
  <circle cx="760" cy="493" r="4" fill="#7e3af2"/>
  <!-- Motor wires from TMC5160 right edge -->
  <line x1="620" y1="506" x2="690" y2="506" stroke="#7e3af2" stroke-width="1.5"/>
  <line x1="690" y1="506" x2="690" y2="473" stroke="#7e3af2" stroke-width="1.5"/>
  <line x1="690" y1="473" x2="760" y2="473" stroke="#7e3af2" stroke-width="1.5"/>
  <line x1="620" y1="523" x2="695" y2="523" stroke="#7e3af2" stroke-width="1.5"/>
  <line x1="695" y1="523" x2="695" y2="493" stroke="#7e3af2" stroke-width="1.5"/>
  <line x1="695" y1="493" x2="760" y2="493" stroke="#7e3af2" stroke-width="1.5"/>
  <text x="675" y="500" fill="#7e3af2" font-size="10">A</text>
  <text x="675" y="519" fill="#7e3af2" font-size="10">B</text>

  <!-- ═══════════════════ Motor PSU ═══════════════════ -->
  <rect x="760" y="70" width="160" height="110" rx="8" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="840" y="92" text-anchor="middle" font-weight="bold" fill="#92400e" font-size="13">Motor PSU</text>
  <text x="840" y="112" text-anchor="middle" fill="#92400e" font-size="11">12–48 V DC</text>
  <text x="840" y="130" text-anchor="middle" fill="#888" font-size="10">(separate from USB)</text>
  <text x="840" y="148" text-anchor="middle" fill="#888" font-size="10">GND shared w/ ESP32</text>
  <circle cx="760" cy="113" r="4" fill="#b45309"/>
  <circle cx="760" cy="133" r="4" fill="#000"/>

  <!-- VM+ wire: TMC right edge → PSU -->
  <line x1="620" y1="364" x2="700" y2="364" stroke="#b45309" stroke-width="2"/>
  <line x1="700" y1="364" x2="700" y2="113" stroke="#b45309" stroke-width="2"/>
  <line x1="700" y1="113" x2="760" y2="113" stroke="#b45309" stroke-width="2"/>
  <text x="658" y="358" fill="#b45309" font-size="10">VM+</text>

  <!-- PSU GND: TMC right edge → PSU GND, also ties to ESP32 GND -->
  <line x1="620" y1="387" x2="710" y2="387" stroke="#333" stroke-width="1.5"/>
  <line x1="710" y1="387" x2="710" y2="133" stroke="#333" stroke-width="1.5"/>
  <line x1="710" y1="133" x2="760" y2="133" stroke="#333" stroke-width="1.5"/>
  <!-- Common GND junction dot between ESP32 GND run and PSU GND run -->
  <circle cx="360" cy="556" r="4" fill="#000"/>

  <!-- ═══════════════════ HX711 ═══════════════════ -->
  <rect x="430" y="570" width="190" height="210" rx="8" fill="#dcfce7" stroke="#057a55" stroke-width="2"/>
  <text x="525" y="592" text-anchor="middle" font-weight="bold" fill="#065f46" font-size="13">HX711</text>

  <text x="440" y="618" fill="#333">DOUT</text>
  <text x="440" y="641" fill="#333">SCK</text>
  <text x="440" y="664" fill="#c81e1e" font-weight="bold">VCC</text>
  <text x="468" y="664" fill="#888" font-size="10"> 3.3V</text>
  <text x="440" y="687" fill="#333">GND</text>
  <text x="440" y="718" fill="#333">E+ / E−</text>
  <text x="440" y="738" fill="#333">A+ / A−</text>
  <text x="510" y="718" fill="#888" font-size="10">Load cell</text>
  <text x="510" y="738" fill="#888" font-size="10">excitation/signal</text>

  <circle cx="430" cy="617" r="4" fill="#057a55"/>
  <circle cx="430" cy="640" r="4" fill="#057a55"/>
  <circle cx="430" cy="663" r="4" fill="#c81e1e"/>
  <circle cx="430" cy="686" r="4" fill="#000"/>

  <!-- ESP32 → HX711 wires -->
  <!-- DOUT (GPIO32) -->
  <line x1="210" y1="333" x2="290" y2="333" stroke="#057a55" stroke-width="1.5"/>
  <line x1="290" y1="333" x2="290" y2="617" stroke="#057a55" stroke-width="1.5"/>
  <line x1="290" y1="617" x2="430" y2="617" stroke="#057a55" stroke-width="1.5"/>
  <text x="248" y="327" fill="#057a55" font-size="10">DOUT</text>
  <!-- SCK (GPIO33) -->
  <line x1="210" y1="356" x2="300" y2="356" stroke="#057a55" stroke-width="1.5"/>
  <line x1="300" y1="356" x2="300" y2="640" stroke="#057a55" stroke-width="1.5"/>
  <line x1="300" y1="640" x2="430" y2="640" stroke="#057a55" stroke-width="1.5"/>
  <text x="253" y="350" fill="#057a55" font-size="10">SCK</text>
  <!-- 3.3V → VCC HX711 -->
  <line x1="210" y1="510" x2="370" y2="510" stroke="#c81e1e" stroke-width="2"/>
  <line x1="370" y1="510" x2="370" y2="663" stroke="#c81e1e" stroke-width="2"/>
  <line x1="370" y1="663" x2="430" y2="663" stroke="#c81e1e" stroke-width="2"/>
  <!-- GND → GND HX711 -->
  <line x1="360" y1="556" x2="360" y2="686" stroke="#333" stroke-width="1.5"/>
  <line x1="360" y1="686" x2="430" y2="686" stroke="#333" stroke-width="1.5"/>

  <!-- ═══════════════════ Digital Caliper ═══════════════════ -->
  <rect x="760" y="230" width="200" height="160" rx="8" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
  <text x="860" y="252" text-anchor="middle" font-weight="bold" fill="#9d174d" font-size="13">Digital Caliper</text>

  <text x="770" y="278" fill="#333">CLK</text>
  <text x="770" y="301" fill="#333">DATA</text>
  <text x="770" y="324" fill="#b45309" font-weight="bold">VCC</text>
  <text x="800" y="324" fill="#888" font-size="10"> 1.5V (internal battery)</text>
  <text x="770" y="347" fill="#333">GND</text>
  <text x="770" y="367" fill="#888" font-size="10">Share GND only — do NOT</text>
  <text x="770" y="380" fill="#888" font-size="10">connect 3.3V/5V to caliper</text>

  <circle cx="760" cy="277" r="4" fill="#9d174d"/>
  <circle cx="760" cy="300" r="4" fill="#9d174d"/>
  <circle cx="760" cy="346" r="4" fill="#000"/>

  <!-- ESP32 → Caliper wires -->
  <!-- CLK (GPIO27) -->
  <line x1="210" y1="410" x2="410" y2="410" stroke="#9d174d" stroke-width="1.5"/>
  <line x1="410" y1="410" x2="410" y2="277" stroke="#9d174d" stroke-width="1.5"/>
  <line x1="410" y1="277" x2="760" y2="277" stroke="#9d174d" stroke-width="1.5"/>
  <text x="310" y="404" fill="#9d174d" font-size="10">CLK</text>
  <!-- DATA (GPIO26) -->
  <line x1="210" y1="433" x2="420" y2="433" stroke="#9d174d" stroke-width="1.5"/>
  <line x1="420" y1="433" x2="420" y2="300" stroke="#9d174d" stroke-width="1.5"/>
  <line x1="420" y1="300" x2="760" y2="300" stroke="#9d174d" stroke-width="1.5"/>
  <text x="310" y="427" fill="#9d174d" font-size="10">DATA</text>
  <!-- Caliper GND — from ESP32 GND bus at x=360 -->
  <line x1="360" y1="556" x2="360" y2="346" stroke="#333" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="360" y1="346" x2="760" y2="346" stroke="#333" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="560" y="340" text-anchor="middle" fill="#555" font-size="10">common GND</text>

  <!-- ═══════════════════ Warning box ═══════════════════ -->
  <rect x="20" y="650" width="390" height="135" rx="6" fill="#fef2f2" stroke="#c81e1e" stroke-width="1.5"/>
  <text x="215" y="670" text-anchor="middle" font-weight="bold" fill="#c81e1e" font-size="12">⚠  Important Notes</text>
  <text x="30" y="690" fill="#333" font-size="11">• TMC5160 VIO must be 3.3V — NOT 5V (SPI will fail at 5V)</text>
  <text x="30" y="708" fill="#333" font-size="11">• Motor PSU GND must share common GND with ESP32</text>
  <text x="30" y="726" fill="#333" font-size="11">• Caliper runs from its own 1.5V battery — share GND only</text>
  <text x="30" y="744" fill="#333" font-size="11">• EN pin is active-LOW; firmware drives HIGH when idle</text>
  <text x="30" y="762" fill="#333" font-size="11">• SPI: MODE3, 500 kHz, MSB first</text>
  <text x="30" y="780" fill="#333" font-size="11">• GPIO32–33 (HX711): bit-bang, interrupts disabled during read</text>

  <!-- Legend -->
  <rect x="430" y="795" width="1" height="1" fill="none"/>
  <rect x="680" y="650" width="400" height="135" rx="6" fill="#f0f4ff" stroke="#1a56db" stroke-width="1.5"/>
  <text x="880" y="670" text-anchor="middle" font-weight="bold" fill="#1a56db" font-size="12">Pin Summary</text>
  <text x="690" y="690" fill="#1a56db" font-size="11">Blue  — SPI bus + STEP/DIR/EN  (TMC5160)</text>
  <text x="690" y="708" fill="#057a55" font-size="11">Green — HX711 load cell amplifier</text>
  <text x="690" y="726" fill="#9d174d" font-size="11">Pink  — Digital caliper  (GPIO27, 26)</text>
  <text x="690" y="744" fill="#c81e1e" font-size="11">Red   — 3.3V power rails  (VIO + HX711 VCC)</text>
  <text x="690" y="762" fill="#b45309" font-size="11">Amber — Motor power supply  (VM+)</text>
  <text x="690" y="780" fill="#7e3af2" font-size="11">Purple — Stepper motor coil wires</text>
  <text x="690" y="797" fill="#333" font-size="11">Black — GND  (all rails share common ground)</text>
</svg>
